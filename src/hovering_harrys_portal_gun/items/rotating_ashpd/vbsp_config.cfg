"Conditions"
	{
	"Condition"
		{
		"Priority" "-400" 
		"instance"	"<ROTATING_ASHPD>"
		"Result"
			{
			"Has" "NeedsAbsFizz" // Make exit doors use abs fizzlers.
			"SetInstVar" "$start_forward !$start_reversed"
			"PackFile" "scripts/vscripts/bee2/hovering_harry/teleport_to_player.nut"

			//Advanced outputs
			"LinkedItem" 
				{
				"Group"		"BEE2_ROTATING_ASHPD"
				"AllowLoop"	"true"
				"StartLogic"	""
				"MidLogic"	""
				"EndLogic"	""
				"LoopLogic"	""
				"Antlines"	"remove"
				"TransferIO"	"false"
				}
			}

		//Swaps to an instance that outputs to the next instance with $timer_delay as a parameter
		"Condition"
			{
			"instvar"	"$timer_delay 0"
			"Result"
				{
				//"SetBlock"
				//	{
				//		"type"		"EMBED"
				//		"offset"	"0 0 0"
				//	}
				"GenRotatingEnt"
					{
					"Axis"		"Z"
					"Classname"	"func_door_rotating"
					"Reversed"	"0"

					"Name"		"pedestal_rotate"
					"Pos"       "0 0 -40"
					"Keys"
						{
						"distance"      "90"
						"speed"         "30"
						"wait"          "-1"
						}
					}
				"SetTile"
					{
					"Tile"	"4444"
					"Tile"	"4444"
					"Tile"	"4444"
					"Tile"	"4444"
					}
				"TemplateBrush"
					{
					"ID"            "BEE_PGUN_BASE"
					"Force"         "4x4 $tilecolor"
					"replaceBrush"  "0 0 0"
					}
				}
			"Else"
				{
					"ChangeInstance"	"<ROTATING_ASHPD:bee2_inputter>"
				}
			}
		"Condition"
			{
			"instvar" "$start_reversed 0"
			"Result"
				{
				"SetInstVar" "$sound Weapon_Portalgun.fire_blue"
				"SetInstVar" "$firecode firePortal1()"
				}
			"Else"
				{
				"SetInstVar" "$sound Weapon_Portalgun.fire_red"
				"SetInstVar" "$firecode firePortal2()"
				}
			}
		}
	}
